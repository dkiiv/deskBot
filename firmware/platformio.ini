; deskbot firmware - ESP32-S3 target.
;
; Build:  pio run                (from firmware/)
; Flash:  pio run -t upload
;
; The motion/safety core lives one level up in ../core/include and is included
; header-only. firmware/ must never modify core/; if something here looks like
; it is compensating for a core bug, write it up in docs/firmware-design-notes.md instead.
[platformio]
name = deskbot-firmware
src_dir = src
include_dir = include

[env:esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino

; Puts ../core/include on the include path. Must live in the [env:*] section:
; PlatformIO ignores extra_scripts under [platformio] (it warns, then carries on
; without it), and ${VAR} substitution inside build_flags does not expand here
; either. Both failures are silent except for one line near the top of the log.
extra_scripts = pre:extra.py

; USB-CDC on the S3's native USB, so the status line and any future CLI need no
; extra chip (this is why the PCB handoff specified an S3).
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
build_type = release

; No exceptions: core/ is exception-free by contract and throws nowhere.
; No RTTI: the HAL is a single static instance, never dynamically cast.
build_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -Wall
    -Wextra
    -DESP32_TARGET=1
    ; Route `Serial` to the S3 native USB-Serial-JTAG CDC instead of UART0.
    ; Without this flag ARDUINO_USB_CDC_ON_BOOT defaults to 0 and `Serial`
    ; stays on GPIO43/44; with it `Serial` is the HWCDC object and the console
    ; appears on the USB-C connector the board is flashed through.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; The other USB-on-boot modes OFF explicitly: USB.h combines them into
    ; ARDUINO_USB_ON_BOOT, and while an undefined token evaluates to 0 in #if,
    ; pinning them makes the intent survive a core-header change.
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0

build_unflags =
    -std=gnu++11
    -fexceptions

; Bundled ESP32 Arduino library used by main.cpp. ../core is deliberately NOT
; listed here or in lib_extra_dirs: it is header-only and reaches the compiler
; through extra.py, so the dependency finder never tries to build it as a
; library.
lib_deps =
    Wire

; The smoke target proves the toolchain and board definition are intact when
; the real firmware fails for unrelated reasons.
build_src_filter = +<main.cpp>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

[env:esp32s3_smoke]
extends = env:esp32s3
lib_deps =
build_src_filter = +<smoke.cpp>
